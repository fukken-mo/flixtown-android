name: Continue Watching menu check

# Hold OK on a Continue Watching card -> Resume / Start over / Remove, on a 1080p Android TV
# emulator (QA build, offline demo server). The same script also runs inside "Release check".
# Results are committed to qa/continue-menu only.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: [".github/qa/continue_menu.sh", ".github/workflows/continue-menu-qa.yml"]

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build QA APK
        run: ./gradlew :app:assembleQa --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Continue Watching menu on an Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/qa/continue_menu.sh || true
      - name: Result
        if: always()
        run: |
          cat qa/continue-menu/report.txt || true
          ! grep -h '^FAIL' qa/continue-menu/report.txt
      - name: Commit screenshots
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/continue-menu
          git commit -m "Continue Watching menu check from TV emulator (${GITHUB_SHA::7})" || exit 0
          for i in 1 2 3; do git pull --rebase origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME} && break; sleep $((i*5)); done
