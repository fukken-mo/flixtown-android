name: Ratings and badges

# TMDB ratings, real Trending and proven "new" badges:
#  1. Panel: title-matching tests and ratings.php / trending.php against a fake TMDB API; builds the
#     panel upload ZIP (new files only).
#  2. App: unit tests, then the QA build on a 1080p Android TV emulator with mixed demo cases.
#     Screenshots and the report are committed to qa/ratings-badges.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: [".github/qa/ratings_badges.sh", ".github/workflows/ratings-qa.yml", "panel/tmdb/**"]

permissions:
  contents: write

jobs:
  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Title matching rules
        run: php panel/tests/tmdb_match_test.php
      - name: ratings.php and trending.php against a fake TMDB API
        run: bash panel/tests/tmdb_http_test.sh
      - name: Panel ZIP (new files only)
        run: |
          rm -rf pkg && mkdir -p pkg/flixtown-panel-ratings/api
          cp panel/tmdb/tmdb-match.php panel/tmdb/ratings.php panel/tmdb/trending.php pkg/flixtown-panel-ratings/api/
          cp panel/README-RATINGS.txt pkg/flixtown-panel-ratings/
          (cd pkg && zip -qr ../flixtown-panel-ratings.zip flixtown-panel-ratings)
          unzip -l flixtown-panel-ratings.zip
      - uses: actions/upload-artifact@v4
        with: { name: flixtown-panel-ratings, path: flixtown-panel-ratings.zip, if-no-files-found: error, retention-days: 30 }

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Build QA APK
        run: ./gradlew :app:assembleQa --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Ratings and badges on an Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/qa/ratings_badges.sh
      - name: Result
        if: always()
        run: cat qa/ratings-badges/report.txt; ! grep -q '^FAIL' qa/ratings-badges/report.txt
      - name: Commit screenshots
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/ratings-badges
          git commit -m "Ratings and badges QA from TV emulator (${GITHUB_SHA::7})" || exit 0
          git pull --rebase origin ${GITHUB_REF_NAME} || true
          git push origin HEAD:${GITHUB_REF_NAME}
