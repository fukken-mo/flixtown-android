name: Skip intro Preview
on:
  push:
    branches: [codex/skip-intro-preview]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: skip-intro-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Exporter tests
        run: python3 tools/intro-preview/test_export.py
      - name: Local QA video
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          mkdir -p app/src/qa/assets
          ffmpeg -v error -f lavfi -i color=c=black:s=320x180:r=24 -f lavfi -i sine=frequency=440:sample_rate=44100 -t 30 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -movflags +faststart app/src/qa/assets/intro-test.mp4
      - name: Unit tests and Preview/QA builds only
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleQa :app:assembleQaAndroidTest -PflixPreview=true -PflixSyncTests=true -PflixVersionName=3.8.21-skip-intro-preview --console=plain
      - name: APK identity and checksum
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/aapt2" dump badging app/build/outputs/apk/debug/app-debug.apk | head -1
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: intro-unit-results, path: app/build/test-results/, retention-days: 7}
      - uses: actions/upload-artifact@v4
        with:
          name: intro-device-builds
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/qa/app-qa.apk
            app/build/outputs/apk/androidTest/qa/app-qa-androidTest.apk
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with: {name: FlixTown-Intro-Preview-Exporter, path: tools/intro-preview/, retention-days: 14}
  device:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {api: 28, profile: tv_720p}
          - {api: 31, profile: tv_1080p}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: intro-device-builds, path: apks}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: android-tv
          arch: x86
          profile: ${{ matrix.profile }}
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r apks/qa/app-qa.apk
            adb install -r apks/androidTest/qa/app-qa-androidTest.apk
            adb logcat -c
            timeout 15m adb shell am instrument -w -r com.myflixtown.tv.native.qa.test/android.test.InstrumentationTestRunner | tee device-results.txt
            timeout 20s adb logcat -d -v threadtime > device-logcat.txt || true
            timeout 20s adb shell dumpsys activity activities > activity-state.txt || true
            timeout 20s adb pull /sdcard/Android/data/com.myflixtown.tv.native.qa/files/profiles-ui profiles-ui || true
      - name: Require all tests
        run: grep -q 'OK (47 tests)' device-results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intro-device-api${{ matrix.api }}
          path: |
            device-results.txt
            device-logcat.txt
            activity-state.txt
            profiles-ui/
          retention-days: 7
  preview:
    needs: [build, device]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {name: intro-device-builds, path: apks}
      - uses: actions/upload-artifact@v4
        with: {name: FlixTown-Skip-Intro-PREVIEW, path: apks/debug/app-debug.apk, retention-days: 14}
