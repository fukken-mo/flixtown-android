name: Episode watched Preview
on:
  push:
    branches: [codex/episode-watched]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and separate Preview/QA builds
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleQa :app:assembleQaAndroidTest -PflixPreview=true -PflixSyncTests=true -PflixVersionName=3.8.20-watched-preview --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watched-unit-results
          path: app/build/test-results/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: FlixTown-Episode-Watched-PREVIEW
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: watched-instrumentation-apks
          path: |
            app/build/outputs/apk/qa/app-qa.apk
            app/build/outputs/apk/androidTest/qa/app-qa-androidTest.apk
          retention-days: 2
  sync-regression:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {api: 28, profile: tv_720p}
          - {api: 31, profile: tv_1080p}
    steps:
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/download-artifact@v4
        with: {name: watched-instrumentation-apks, path: fixture-apks}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: android-tv
          arch: x86
          profile: ${{ matrix.profile }}
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r fixture-apks/qa/app-qa.apk
            adb install -r fixture-apks/androidTest/qa/app-qa-androidTest.apk
            adb shell am instrument -w -r com.myflixtown.tv.native.qa.test/android.test.InstrumentationTestRunner | tee device-results.txt
            grep -q 'OK (13 tests)' device-results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watched-sync-api${{ matrix.api }}
          path: device-results.txt
          retention-days: 7
