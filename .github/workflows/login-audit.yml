name: Login audit check

# Focused emulator check for the production-readiness audit fixes: expired QR code renewal and
# account switching (.github/qa/login_audit.sh). One API 31 1080p job; test build only, nothing published.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: [".github/qa/login_audit.sh", ".github/workflows/login-audit.yml"]

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Build QA APK
        run: ./gradlew :app:assembleQa --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Login audit on an Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/qa/login_audit.sh || true
      - name: Result
        if: always()
        run: |
          cat qa/login-audit/report.txt || true
          grep -q '^login audit: [0-9]* passed, 0 failed' qa/login-audit/report.txt
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/login-audit
          git commit -m "Login audit check from TV emulator (${GITHUB_SHA::7})" || exit 0
          for i in 1 2 3; do git pull --rebase origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME} && break; sleep $((i*5)); done
