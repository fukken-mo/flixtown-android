name: Release check

# Full release check of the QA build on 1080p and 720p Android TV emulators:
#  - ratings_badges.sh: TMDB ratings, real Trending, NEW SERIES / NEW EPISODES (asserted)
#  - release_check.sh: QR + remote sign-in with keyboard, saved login, intro, focus restoration,
#    cast/trailer/My List, seasons/episodes/resume, player controls/seek/tracks/Back, Up next,
#    renewal, no refresh during navigation (asserted)
#  - continue_menu.sh (1080p job): hold OK on Continue Watching -> Resume / Start over / Remove (asserted)
#  - account_page.sh (1080p job): Settings account Status / Expiration / Connections, refresh and offline (asserted)
#  - screen_awake.sh (1080p job): no screensaver while Home / Details / player is in front; the TV's own
#    screensaver and sleep work again once Flix Town is in the background or closed (asserted)
# The screen tour (run.sh, qa-emulator.yml) and the update flow (update-flow.yml) have their own
# workflows. Results are committed to qa/release-check, qa/release-check-720p, qa/ratings-badges and
# qa/screen-awake and qa/account-page only.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: [".github/qa/release_check.sh", ".github/qa/screen_awake.sh", ".github/qa/account_page.sh", ".github/workflows/release-qa.yml"]

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { profile: tv_1080p, out: qa/release-check, badges: "yes" }
          - { profile: tv_720p, out: qa/release-check-720p, badges: "no" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Build QA APK
        run: ./gradlew :app:assembleQa --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Release check on an Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: android-tv
          arch: x86
          profile: ${{ matrix.profile }}
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            QA_OUT=${{ matrix.out }} bash .github/qa/release_check.sh || true
            if [ "${{ matrix.badges }}" = yes ]; then bash .github/qa/ratings_badges.sh || true; fi
            if [ "${{ matrix.badges }}" = yes ]; then bash .github/qa/continue_menu.sh || true; fi
            if [ "${{ matrix.badges }}" = yes ]; then bash .github/qa/screen_awake.sh || true; fi
            if [ "${{ matrix.badges }}" = yes ]; then bash .github/qa/account_page.sh || true; fi
      - name: Result
        if: always()
        run: |
          reports="${{ matrix.out }}/report.txt"; [ "${{ matrix.badges }}" = yes ] && reports="$reports qa/ratings-badges/report.txt qa/continue-menu/report.txt qa/screen-awake/report.txt qa/account-page/report.txt"
          cat $reports || true
          ! grep -h '^FAIL' $reports
      - name: Commit screenshots
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ${{ matrix.out }}; [ "${{ matrix.badges }}" = yes ] && git add qa/ratings-badges qa/continue-menu qa/screen-awake qa/account-page
          git commit -m "Release check from TV emulator, ${{ matrix.profile }} (${GITHUB_SHA::7})" || exit 0
          for i in 1 2 3; do git pull --rebase origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME} && break; sleep $((i*5)); done
