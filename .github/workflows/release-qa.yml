name: Release check

# Full release check of the QA build on a 1080p Android TV emulator:
#  - run.sh: screen tour (Home rows, grids, sort/categories, details, Settings, refresh, player prefs)
#  - ratings_badges.sh: TMDB ratings, real Trending, NEW SERIES / NEW EPISODES (asserted)
#  - release_check.sh: QR + remote sign-in with keyboard, saved login, intro, focus restoration,
#    cast/trailer/My List, seasons/episodes/resume, player controls/seek/tracks/Back, Up next,
#    renewal, no refresh during navigation (asserted)
# The update flow has its own workflow (update-flow.yml). Results are committed to qa/.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: [".github/qa/release_check.sh", ".github/workflows/release-qa.yml"]

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Build QA APK
        run: ./gradlew :app:assembleQa --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Release check on an Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            bash .github/qa/release_check.sh || true
            bash .github/qa/ratings_badges.sh || true
            bash .github/qa/run.sh || true
      - name: Result
        if: always()
        run: |
          cat qa/release-check/report.txt qa/ratings-badges/report.txt || true
          ! grep -h '^FAIL' qa/release-check/report.txt qa/ratings-badges/report.txt
      - name: Commit screenshots
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa
          git commit -m "Release check from TV emulator (${GITHUB_SHA::7})" || exit 0
          git pull --rebase origin ${GITHUB_REF_NAME} || true
          git push origin HEAD:${GITHUB_REF_NAME}
