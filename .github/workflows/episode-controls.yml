name: Flix Town viewer additions Preview
on:
  push:
    branches: [codex/episode-controls]
    paths: ['app/src/**', '.github/qa/episode_controls.sh', '.github/qa/remote_guide.sh', '.github/workflows/episode-controls.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      requests: ${{ steps.scope.outputs.requests }}
      player: ${{ steps.scope.outputs.player }}
      guide: ${{ steps.scope.outputs.guide }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 2 }
      - name: Scope emulator checks to changed features
        id: scope
        run: |
          if git diff --name-only HEAD^ HEAD | grep -Eq '(RequestsActivity|RequestsApi|Api|Catalog|SignOut|ViewerOptions|HomeActivity|NavRail|Ui)\.java|requests_flow\.sh'; then
            echo 'requests=true' >> "$GITHUB_OUTPUT"
          else
            echo 'requests=false' >> "$GITHUB_OUTPUT"
          fi
          if git diff --name-only HEAD^ HEAD | grep -Eq '(PlayerActivity|EpisodeNavigation|ViewerOptions|Catalog|SignOut|DetailsActivity|PlayerIcon)\.java|episode_controls\.sh'; then
            echo 'player=true' >> "$GITHUB_OUTPUT"
          else
            echo 'player=false' >> "$GITHUB_OUTPUT"
          fi
          if git diff --name-only HEAD^ HEAD | grep -Eq 'RemoteGuideActivity\.java|SettingsPage\.java|AndroidManifest\.xml|remote_guide\.sh'; then
            echo 'guide=true' >> "$GITHUB_OUTPUT"
          else
            echo 'guide=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, Preview and offline QA only
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleQa -PflixPreview=true -PflixVersionName=3.8.15-viewer-additions --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: FlixTown-Viewer-Additions-PREVIEW-test-only
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: episode-controls-qa-apk
          path: app/build/outputs/apk/qa/app-qa.apk
          retention-days: 2
  tv:
    needs: build
    if: github.event_name == 'workflow_dispatch' || needs.build.outputs.player == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 28, profile: tv_720p }
          - { api: 31, profile: tv_1080p }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/download-artifact@v4
        with: { name: episode-controls-qa-apk, path: app/build/outputs/apk/qa }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare local video and subtitle fixture (no external stream)
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y ffmpeg; }
          bash .github/qa/make_subtitle_video.sh media/source.mkv 1280x720
          ffmpeg -hide_banner -loglevel error -y -i media/source.mkv -map 0 -t 75 -c copy media/episode-test.mkv
          nohup python3 -m http.server 8766 --bind 0.0.0.0 --directory media > /tmp/episode-video-server.log 2>&1 &
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 --retry-max-time 20 http://127.0.0.1:8766/episode-test.mkv -o /dev/null
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          QA_OUT: qa/episode-controls-api${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          target: android-tv
          arch: x86
          profile: ${{ matrix.profile }}
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/qa/episode_controls.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: episode-controls-results-api${{ matrix.api }}
          path: qa/episode-controls-api${{ matrix.api }}/
          retention-days: 7

  requests:
    needs: build
    if: github.event_name == 'workflow_dispatch' || needs.build.outputs.requests == 'true' 
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/download-artifact@v4
        with: { name: episode-controls-qa-apk, path: app/build/outputs/apk/qa }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          QA_OUT: qa/viewer-requests
        with:
          api-level: 31
          target: android-tv
          arch: x86
          profile: tv_1080p
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/qa/requests_flow.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewer-requests-results
          path: qa/viewer-requests/
          retention-days: 7

  guide:
    needs: build
    if: github.event_name == 'workflow_dispatch' || needs.build.outputs.guide == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 28, profile: tv_720p }
          - { api: 31, profile: tv_1080p }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/download-artifact@v4
        with: { name: episode-controls-qa-apk, path: app/build/outputs/apk/qa }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          QA_OUT: qa/remote-guide-api${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          target: android-tv
          arch: x86
          profile: ${{ matrix.profile }}
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/qa/remote_guide.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remote-guide-results-api${{ matrix.api }}
          path: qa/remote-guide-api${{ matrix.api }}/
          retention-days: 7
