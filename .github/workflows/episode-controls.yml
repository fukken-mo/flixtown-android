name: Previous and next episode Preview
on:
  push:
    branches: [codex/episode-controls]
    paths: ['app/src/**', '.github/qa/episode_controls.sh', '.github/workflows/episode-controls.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, Preview and offline QA only
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleQa -PflixPreview=true -PflixVersionName=3.8.15-episode-controls --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: FlixTown-Episode-Controls-PREVIEW-test-only
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: episode-controls-qa-apk
          path: app/build/outputs/apk/qa/app-qa.apk
          retention-days: 2
  tv:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 28, profile: tv_720p }
          - { api: 31, profile: tv_1080p }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/download-artifact@v4
        with: { name: episode-controls-qa-apk, path: app/build/outputs/apk/qa }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          QA_OUT: qa/episode-controls-api${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          target: android-tv
          arch: x86
          profile: ${{ matrix.profile }}
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/qa/episode_controls.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: episode-controls-results-api${{ matrix.api }}
          path: qa/episode-controls-api${{ matrix.api }}/
          retention-days: 7
