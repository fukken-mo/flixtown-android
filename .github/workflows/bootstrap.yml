name: Bootstrap fresh source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack and publish fresh project
        run: |
          if [ ! -f FlixTownFreshSource.zip ]; then
            echo "Source already unpacked"
            exit 0
          fi
          unzip -o FlixTownFreshSource.zip
          rm FlixTownFreshSource.zip
          chmod +x gradlew
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Create fresh Flix Town TV project"
          git push
