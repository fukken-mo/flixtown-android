name: Requests flow check

# Requests (Seerr through OnePanel): the OnePanel customer API tests (PHP, fake Seerr) and the TV
# screen with the QA build's demo server, D-pad only, on Android 9 (API 28) and 12 (API 31) at 1080p
# and 720p. Runs on pushes to the feature/request-media branch that touch the Requests code or tests
# (never on the production branch, never a release). Results are committed to qa/requests-flow-* only.
on:
  workflow_dispatch:
  push:
    branches: ["feature/request-media"]
    paths: ["app/**", "panel/onepanel-tv-requests/**", ".github/qa/requests_flow.sh", ".github/workflows/requests-flow-qa.yml"]

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: OnePanel customer requests API (php -S, SQLite, fake Seerr; no real Seerr)
        run: |
          for f in panel/onepanel-tv-requests/api/*.php panel/onepanel-tv-requests/includes/*.php; do php -l "$f"; done
          php panel/onepanel-tv-requests/tests/tv_requests_test.php
  apk-secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug and QA APKs
        run: for attempt in 1 2 3; do ./gradlew -q :app:assembleDebug :app:assembleQa && break; sleep $((attempt*20)); done
      - name: Scan APKs for secrets and backend names
        run: |
          fail=0
          for apk in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/qa/app-qa.apk; do
            rm -rf scan && mkdir scan && unzip -q -o "$apk" -d scan
            strings -n 6 scan/classes*.dex scan/resources.arsc scan/AndroidManifest.xml > scan/all.txt
            echo "== $apk ($(wc -l < scan/all.txt) strings)"
            for pat in 'X-Api-Key' 'X-API-User' 'requests\.myflixtown\.com' '[Ss]eerr' '[Rr]adarr' '[Ss]onarr' '[Jj]ellyfin' 'api_key' 'apiKey' 'sk_live' 'EAAA[A-Za-z0-9_-]{20,}' 'session_secret' 'requester_user_id' 'Bearer '; do
              hits=$(grep -E -c -- "$pat" scan/all.txt || true)
              printf '  %-28s %s\n' "$pat" "$hits"; [ "$hits" = 0 ] || { grep -E -- "$pat" scan/all.txt | head -3; fail=1; }
            done
          done
          exit $fail
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 31, profile: tv_1080p, out: qa/requests-flow-api31-1080p }
          - { api: 31, profile: tv_720p, out: qa/requests-flow-api31-720p }
          - { api: 28, profile: tv_1080p, out: qa/requests-flow-api28-1080p }
          - { api: 28, profile: tv_720p, out: qa/requests-flow-api28-720p }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and QA APK
        run: |
          for attempt in 1 2 3; do ./gradlew :app:testDebugUnitTest :app:assembleQa --stacktrace && break; sleep $((attempt*20)); done
          test -f app/build/outputs/apk/qa/app-qa.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Requests flow on an Android TV emulator (API ${{ matrix.api }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: android-tv
          arch: x86
          profile: ${{ matrix.profile }}
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: QA_OUT=${{ matrix.out }} bash .github/qa/requests_flow.sh || true
      - name: Result
        if: always()
        run: |
          cat ${{ matrix.out }}/report.txt || true
          ! grep -h '^FAIL' ${{ matrix.out }}/report.txt
          grep -q '^requests flow: [0-9]* passed, 0 failed' ${{ matrix.out }}/report.txt   # the run reached its end
      - name: Commit screenshots
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ${{ matrix.out }}
          git commit -m "Requests flow check from TV emulator, API ${{ matrix.api }} ${{ matrix.profile }} (${GITHUB_SHA::7})" || exit 0
          for i in 1 2 3 4 5 6 7 8; do git pull --rebase origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME} && break; sleep $((i*3 + RANDOM % 7)); done
