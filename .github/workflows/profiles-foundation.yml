name: Profiles foundation checks
on:
  push:
    branches: [codex/profiles]
permissions:
  contents: read
concurrency:
  group: profiles-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install Pillow==11.3.0
      - run: python .github/qa/check_profile_assets.py
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and run all JVM tests
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug -PflixPreview=true --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profiles-foundation-test-results
          path: app/build/test-results/
          retention-days: 7
