name: Build Nimer TV APK

# Nimer TV lives in nimertv/ and is built independently of Flix Town.
on:
  workflow_dispatch:
  push:
    paths:
      - "nimertv/**"
      - ".github/workflows/build-nimertv.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nimertv
    env:
      # Optional repository secrets. When they are present a signed release APK is built too.
      NIMER_KEYSTORE_BASE64: ${{ secrets.NIMER_KEYSTORE_BASE64 }}
      NIMER_KEYSTORE_PASSWORD: ${{ secrets.NIMER_KEYSTORE_PASSWORD }}
      NIMER_KEY_ALIAS: ${{ secrets.NIMER_KEY_ALIAS }}
      NIMER_KEY_PASSWORD: ${{ secrets.NIMER_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: NimerTV-debug
          path: nimertv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Unit, HTTP and screen tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Build signed release APK
        if: env.NIMER_KEYSTORE_BASE64 != ''
        run: |
          echo "$NIMER_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nimer-release.jks"
          NIMER_KEYSTORE_FILE="$RUNNER_TEMP/nimer-release.jks" ./gradlew :app:assembleRelease --stacktrace
          rm -f "$RUNNER_TEMP/nimer-release.jks"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/NimerTV27.apk"
          # Fails the build unless the APK carries the permanent production certificate.
          ./verify-release.sh "$RUNNER_TEMP/NimerTV27.apk" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: env.NIMER_KEYSTORE_BASE64 != ''
        with:
          name: NimerTV27-release
          path: ${{ runner.temp }}/NimerTV27.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NimerTV-screens
          path: nimertv/app/build/screens
          if-no-files-found: ignore
          retention-days: 7
