name: Production release (signed)

# Builds the customer app com.myflixtown.tv.native signed with the PERMANENT Flix Town release key.
# Run it from the tested branch: Actions › "Production release (signed)" › Run workflow.
#
# Needs these repository secrets (Settings › Secrets and variables › Actions › Secrets):
#   FLIXTOWN_RELEASE_KEYSTORE_BASE64   the release .p12 keystore, base64-encoded (one line)
#   FLIXTOWN_RELEASE_KEYSTORE_PASSWORD
#   FLIXTOWN_RELEASE_KEY_ALIAS
#   FLIXTOWN_RELEASE_KEY_PASSWORD
# If any is missing the run stops before building and names it. The Preview/test key is never
# used: the build is accepted only if its certificate is the permanent release certificate below
# (or the repository variable FLIXTOWN_RELEASE_CERT_SHA256, if set). Fingerprints are public; the
# key and passwords never leave the secrets and the keystore file is deleted after the build.
#
# Release badges use movie release dates and TV premiere dates, not upload timestamps. Release dates also persist for unrated titles.
# Every future update: run again with a HIGHER version_code. Same package, same key, always.

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode (must be higher than the version customers have)"
        required: true
        default: "10024"
      version_name:
        description: "versionName shown in Settings"
        required: true
        default: "3.8.4"
  # Also runs once when this file changes on a working branch (with the defaults above), so the
  # first production build does not depend on the workflow being on the default branch yet.
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/release-production.yml", ".github/release/**"]

permissions:
  contents: read
  actions: read   # the upgrade job downloads the earlier production APKs from their runs

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.FLIXTOWN_RELEASE_KEYSTORE_BASE64 }}
      FLIXTOWN_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.FLIXTOWN_RELEASE_KEYSTORE_PASSWORD }}
      FLIXTOWN_RELEASE_KEY_ALIAS: ${{ secrets.FLIXTOWN_RELEASE_KEY_ALIAS }}
      FLIXTOWN_RELEASE_KEY_PASSWORD: ${{ secrets.FLIXTOWN_RELEASE_KEY_PASSWORD }}
      EXPECTED_CERT: ${{ vars.FLIXTOWN_RELEASE_CERT_SHA256 || 'd026a69e07fcdff3a2067ed86f248d91ba4d5d8b0e42d65ec046841089b54e4e' }}
      PREVIEW_CERT: 426f5dda091757c0e4f6adc8d4a5adeff1f0c6d448cab643a92833b5b9ff11b7
      PACKAGE: com.myflixtown.tv.native
      PANEL_UPDATE_URL: https://panelsandapps.com/panels/flixtown2027/api/app-update.php
      VERSION_CODE: ${{ inputs.version_code || '10024' }}
      VERSION_NAME: ${{ inputs.version_name || '3.8.4' }}
    steps:
      - name: Release signing secrets present
        run: |
          missing=0
          for name in FLIXTOWN_RELEASE_KEYSTORE_BASE64:KEYSTORE_B64 FLIXTOWN_RELEASE_KEYSTORE_PASSWORD:FLIXTOWN_RELEASE_KEYSTORE_PASSWORD \
                      FLIXTOWN_RELEASE_KEY_ALIAS:FLIXTOWN_RELEASE_KEY_ALIAS FLIXTOWN_RELEASE_KEY_PASSWORD:FLIXTOWN_RELEASE_KEY_PASSWORD; do
            secret="${name%%:*}"; var="${name##*:}"
            if [ -z "${!var}" ]; then echo "::error::Missing repository secret $secret (GitHub › fukken-mo/flixtown-android › Settings › Secrets and variables › Actions › New repository secret)"; missing=1
            else echo "present: $secret"; fi
          done
          [ "$missing" = 0 ] || { echo "No production APK was built: the permanent release key is not configured."; exit 1; }
          echo "$VERSION_CODE" | grep -Eq '^[0-9]+$' || { echo "::error::version_code must be a number"; exit 1; }
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Keystore opens and is the permanent release key
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore" || { echo "::error::FLIXTOWN_RELEASE_KEYSTORE_BASE64 is not valid base64"; exit 1; }
          echo "FLIXTOWN_RELEASE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          cert="$(keytool -list -v -keystore "$RUNNER_TEMP/release.keystore" -storepass "$FLIXTOWN_RELEASE_KEYSTORE_PASSWORD" -alias "$FLIXTOWN_RELEASE_KEY_ALIAS" 2>&1)" \
            || { echo "::error::The keystore did not open with FLIXTOWN_RELEASE_KEYSTORE_PASSWORD and FLIXTOWN_RELEASE_KEY_ALIAS"; exit 1; }
          sha="$(echo "$cert" | sed -n 's/.*SHA256: *//p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')"
          echo "keystore certificate SHA-256: $sha"
          [ "$sha" != "$PREVIEW_CERT" ] || { echo "::error::This is the Preview/test key. Production must use the permanent release key."; exit 1; }
          [ "$sha" = "$EXPECTED_CERT" ] || { echo "::error::Keystore certificate $sha is not the permanent release certificate $EXPECTED_CERT"; exit 1; }
      - name: Unit tests and signed release APK
        run: |
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --stacktrace -PflixVersionCode="$VERSION_CODE" -PflixVersionName="$VERSION_NAME"
          rm -f "$RUNNER_TEMP/release.keystore"
      - name: Verify package, version, certificate and panel update address
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          APK="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          echo "built: $APK"
          case "$APK" in *unsigned*) echo "::error::Release APK is unsigned"; exit 1;; esac
          mkdir -p dist; OUT="dist/FlixTown-${VERSION_NAME}-${VERSION_CODE}-production-signed.apk"; cp "$APK" "$OUT"
          badging="$("$BT/aapt2" dump badging "$OUT")"; line="$(echo "$badging" | head -1)"; echo "$line"
          pkg="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<< "$line")"
          code="$(sed -n "s/.* versionCode='\([^']*\)'.*/\1/p" <<< "$line")"
          name="$(sed -n "s/.* versionName='\([^']*\)'.*/\1/p" <<< "$line")"
          certs="$("$BT/apksigner" verify --verbose --print-certs "$OUT" 2>&1)"; echo "$certs" | grep -E "Verified using|certificate SHA-256" | head -6
          cert="$(grep -m1 "certificate SHA-256 digest" <<< "$certs" | sed 's/.*: *//' | tr -d ' ')"
          fail=0
          [ "$pkg" = "$PACKAGE" ] && echo "PASS  package $pkg" || { echo "::error::package is $pkg, expected $PACKAGE"; fail=1; }
          [ "$code" = "$VERSION_CODE" ] && echo "PASS  versionCode $code" || { echo "::error::versionCode $code"; fail=1; }
          [ "$name" = "$VERSION_NAME" ] && echo "PASS  versionName $name" || { echo "::error::versionName $name"; fail=1; }
          "$BT/apksigner" verify "$OUT" && echo "PASS  apksigner verify" || { echo "::error::signature does not verify"; fail=1; }
          [ "$cert" = "$EXPECTED_CERT" ] && echo "PASS  signed with the permanent release key ($cert)" || { echo "::error::certificate $cert"; fail=1; }
          echo "$badging" | grep -q "application-debuggable" && { echo "::error::APK is debuggable"; fail=1; } || echo "PASS  not debuggable"
          echo "$badging" | grep -q "application-label:'Flix Town'" && echo "PASS  app name Flix Town" || { echo "::error::app name is not Flix Town"; fail=1; }
          rm -rf dex && mkdir dex && unzip -q -o "$OUT" 'classes*.dex' -d dex
          grep -aq "$PANEL_UPDATE_URL" dex/*.dex && echo "PASS  update check address $PANEL_UPDATE_URL" || { echo "::error::panel update address not found in the app"; fail=1; }
          { echo "Flix Town production release"; echo "package=$pkg"; echo "versionCode=$code"; echo "versionName=$name";
            echo "signing certificate SHA-256=$cert"; echo "apk SHA-256=$(sha256sum "$OUT" | cut -c1-64)"; echo "size=$(stat -c %s "$OUT") bytes";
            echo "update check=$PANEL_UPDATE_URL"; echo "commit=$GITHUB_SHA"; } > dist/RELEASE-INFO.txt
          cat dist/RELEASE-INFO.txt
          exit $fail
      - name: Panel reads it as the live panel would (local copy of the update module)
        run: |
          APK="$(ls dist/*.apk)"
          php panel/tests/inspect.php "$APK"; echo
          php panel/tests/credentials_test.php
          php panel/onepanel-tv-renewal/tests/tv_renewal_test.php
          bash .github/release/panel_check.sh "$APK" "$PACKAGE" "$VERSION_CODE" "$EXPECTED_CERT"
      - name: Package release-date panel endpoint
        run: |
          php -l panel/tmdb/ratings.php
          for f in panel/onepanel-tv-renewal/api/*.php panel/onepanel-tv-renewal/includes/*.php panel/onepanel-tv-renewal/cron/*.php; do php -l "$f"; done
          mkdir -p dist/onepanel-tv-renewal && cp -r panel/onepanel-tv-renewal/api panel/onepanel-tv-renewal/includes panel/onepanel-tv-renewal/cron panel/onepanel-tv-renewal/sql panel/onepanel-tv-renewal/config.tv-renewal.example.php panel/onepanel-tv-renewal/README.txt dist/onepanel-tv-renewal/
          mkdir -p dist/panel-api
          cp panel/tmdb/ratings.php dist/panel-api/ratings.php
          printf '%s\\n' 'Replace api/ratings.php in the existing Flix Town app panel. Keep bootstrap.php, tmdb-match.php, configuration and credentials unchanged.' > dist/panel-api/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FlixTown-PRODUCTION-signed-${{ inputs.version_name || '3.8.4' }}-${{ inputs.version_code || '10024' }}
          path: |
            dist/*.apk
            dist/RELEASE-INFO.txt
            dist/panel-api/
            dist/onepanel-tv-renewal/
          if-no-files-found: error
          retention-days: 90

  # Read-only checks of the live services the app uses (GET only; nothing is created or changed).
  # Values are not printed, only status codes, JSON keys and the content server's host.
  live-endpoints:
    runs-on: ubuntu-latest
    env:
      PANEL: https://panelsandapps.com/panels/flixtown2027/api/
    steps:
      - name: Panel API, update endpoint, content server
        run: |
          fail=0
          get(){ curl -sS -m 25 -o "$2" -w '%{http_code} %{content_type}' "$1" || echo "000 -"; }
          r="$(get "${PANEL}config.php" cfg.json)"; echo "config.php -> $r"
          python3 - cfg.json <<'PY' || fail=1
          import json,sys,urllib.parse
          d=json.load(open(sys.argv[1])); print("  keys:", ",".join(sorted(d)))
          u=d.get("xtream_url",""); host=urllib.parse.urlparse(u).netloc
          print("  content server host:", host or "(missing)")
          open("xtream","w").write(u.rstrip("/")); sys.exit(0 if host else 1)
          PY
          r="$(get "${PANEL}app-update.php?package=com.myflixtown.tv.native&version_code=1" upd.json)"; echo "app-update.php (production package) -> $r"
          python3 -c 'import json;d=json.load(open("upd.json"));print("  ok=%s package=%s versionCode=%s has_url=%s has_sha=%s"%(d.get("ok"),d.get("package_name") or d.get("package"),d.get("update_version_code") or d.get("version_code"),bool(d.get("apk_url") or d.get("update_url")),bool(d.get("sha256") or d.get("apk_sha256"))))' || { echo "::error::app-update.php is not JSON"; fail=1; }
          r="$(get "${PANEL}app-update.php?package=com.myflixtown.tv.native.preview&version_code=1" prev.json)"; echo "app-update.php (preview package) -> $r"
          python3 -c 'import json;d=json.load(open("prev.json"));print("  preview offered versionCode:",d.get("update_version_code"))' || true
          r="$(get "${PANEL}trending.php" tr.json)"; echo "trending.php -> $r"
          r="$(get "${PANEL}pair-start" ps.txt)"; echo "pair-start via GET (expect 405, nothing created) -> $r"
          code="$(get "$(cat xtream)/player_api.php" xt.txt | cut -d' ' -f1)"; echo "content server player_api.php (no credentials) -> HTTP $code"
          [ "$code" != "000" ] || { echo "::error::content server not reachable"; fail=1; }
          r="$(get https://myflixtown.com/activate.php act.html)"; echo "myflixtown.com/activate.php -> $r"
          grep -qi "<form" act.html && echo "  activation form present" || echo "  (no form found in page)"
          exit $fail

  # Upgrade from the earlier PRODUCTION builds (same package, same key) on a TV emulator. The
  # emulator's network is switched off so neither build contacts the live panel (no pairing rows).
  upgrade:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@v4
        with: { name: "FlixTown-PRODUCTION-signed-${{ inputs.version_name || '3.8.4' }}-${{ inputs.version_code || '10024' }}", path: new }
      - uses: actions/download-artifact@v4
        with: { name: FlixTown-PRODUCTION-signed-3.8.3-10023, path: old-10023, run-id: 38000675003, github-token: "${{ github.token }}" }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: FlixTown-PRODUCTION-signed-3.8.2-10022, path: old-10022, run-id: 37747826133, github-token: "${{ github.token }}" }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: FlixTown-PRODUCTION-signed-3.8.1-10021, path: old-10021, run-id: 37703600713, github-token: "${{ github.token }}" }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: FlixTown-PRODUCTION-signed-3.8.0-10020, path: old-10020, run-id: 37422757283, github-token: "${{ github.token }}" }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: FlixTown-PRODUCTION-signed-3.7.1-10016, path: old-10016, run-id: 37385757309, github-token: "${{ github.token }}" }
      - uses: actions/download-artifact@v4
        with: { name: FlixTown-PRODUCTION-signed-3.7.0-10015, path: old-10015, run-id: 36939071160, github-token: "${{ github.token }}" }
        continue-on-error: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Write upgrade test
        run: |
          cat > upgrade.sh <<'SH'
          set -u; P=com.myflixtown.tv.native; NEW="$(ls new/*.apk)"; fail=0; mkdir -p shots
          adb shell svc wifi disable; adb shell svc data disable; sleep 2
          for OLD in old-10023/*.apk old-10022/*.apk old-10021/*.apk old-10020/*.apk old-10016/*.apk old-10015/*.apk; do
            [ -f "$OLD" ] || continue; tag="$(basename "$OLD" .apk)"
            adb uninstall $P >/dev/null 2>&1; adb logcat -c
            adb install "$OLD" >/dev/null || { echo "FAIL  install $tag"; fail=1; continue; }
            adb shell monkey -p $P -c android.intent.category.LEANBACK_LAUNCHER 1 >/dev/null 2>&1; sleep 8
            adb shell screencap -p /sdcard/a.png; adb pull /sdcard/a.png "shots/$tag-before.png" >/dev/null
            first="$(adb shell dumpsys package $P | grep -m1 firstInstallTime | tr -d '\r ')"
            before="$(adb shell dumpsys package $P | grep -m1 versionCode | tr -d '\r')"
            out="$(adb install -r "$NEW" 2>&1)"; echo "$out" | tail -1
            echo "$out" | grep -q Success && echo "PASS  $tag -> new: installed over the existing app (same package and key)" || { echo "FAIL  $tag -> new: $out"; fail=1; continue; }
            after="$(adb shell dumpsys package $P | grep -m1 versionCode | tr -d '\r')"
            first2="$(adb shell dumpsys package $P | grep -m1 firstInstallTime | tr -d '\r ')"
            echo "INFO  before: $before"; echo "INFO  after:  $after"
            [ "$first" = "$first2" ] && echo "PASS  upgrade kept the install (and app data): $first2" || { echo "FAIL  reinstalled, not upgraded"; fail=1; }
            adb shell monkey -p $P -c android.intent.category.LEANBACK_LAUNCHER 1 >/dev/null 2>&1; sleep 8
            adb shell screencap -p /sdcard/b.png; adb pull /sdcard/b.png "shots/$tag-after.png" >/dev/null
            adb shell dumpsys activity activities | grep -q "com.myflixtown.tv.native/com.flixtown.tv" && echo "PASS  new version opens after the upgrade" || { echo "FAIL  new version not in front"; fail=1; }
            adb logcat -d | grep -q "FATAL EXCEPTION" && { echo "FAIL  crash"; adb logcat -d | grep -A12 "FATAL EXCEPTION" | head -30; fail=1; } || echo "PASS  no crash"
          done
          adb shell svc wifi enable; exit $fail
          SH
      - name: Upgrade on an Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: android-tv
          arch: x86
          profile: tv_1080p
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash upgrade.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: upgrade-screens, path: shots/, retention-days: 14 }
