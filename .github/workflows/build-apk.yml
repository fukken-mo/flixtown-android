name: Build Flix Town APK

on:
  workflow_dispatch:
    inputs:
      preview:
        description: "Build a side-by-side test copy (Flix Town Preview, package .preview)"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build universal debug APK
        run: ./gradlew :app:assembleDebug --stacktrace -PflixPreview=${{ inputs.preview == true }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.preview == true && 'FlixTown-NativeTV-preview' || 'FlixTown-NativeTV-debug' }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
