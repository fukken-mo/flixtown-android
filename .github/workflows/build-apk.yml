name: Build Flix Town Compose TV APK

on:
  push:
    branches: [codex/flix-compose-tv]
    paths:
      - "FlixTown-ComposeTV/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FlixTown-ComposeTV
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FlixTown-ComposeTV-debug
          path: FlixTown-ComposeTV/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
