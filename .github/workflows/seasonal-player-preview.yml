name: Seasonal splash + player Preview

# Preview only (separate package, debug-signed): seasonal splash, player card fix, subtitle placement,
# accelerated seeking. Panel patch tests (PHP), unit tests, and focused emulator checks with local test
# media (.github/qa/player_seasonal.sh) on API 28/31 at 720p/1080p. Nothing is published or deployed.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/seasonal-player-preview.yml", ".github/qa/player_seasonal.sh", ".github/qa/media_server.py"]

permissions:
  contents: write

jobs:
  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: 'gd, fileinfo, mbstring', coverage: none }
      - name: Panel patch syntax and tests (no network, no database)
        run: |
          find panel/flixtown-seasonal -name '*.php' -exec php -l {} \;
          php panel/flixtown-seasonal/tests/seasonal_test.php
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, Preview APK (separate package) and QA APK
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleQa -PflixPreview=true -PflixVersionName=3.8.17-seasonal-preview --console=plain 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: seasonal-player-build-diagnostics, path: "build.log\napp/build/test-results/", retention-days: 5 }
      - uses: actions/upload-artifact@v4
        with: { name: FlixTown-Seasonal-Player-PREVIEW-test-only, path: app/build/outputs/apk/debug/app-debug.apk, retention-days: 14 }
      - uses: actions/upload-artifact@v4
        with: { name: seasonal-player-qa-apk, path: app/build/outputs/apk/qa/app-qa.apk, retention-days: 2 }
  tv:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 31, profile: tv_1080p }
          - { api: 31, profile: tv_720p }
          - { api: 28, profile: tv_1080p }
          - { api: 28, profile: tv_720p }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { name: seasonal-player-qa-apk, path: app/build/outputs/apk/qa }
      - name: Test media (videos with known subtitles, splash pictures)
        run: |
          for i in 1 2 3; do sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null && break; sleep 10; done
          bash .github/qa/make_subtitle_video.sh media/subs.mkv 1280x720
          # The cut test drops the connection at a playback time, not a byte share (a still picture compresses unevenly)
          off(){ ffprobe -v error -select_streams v:0 -show_entries packet=pts_time,pos -of csv=p=0 media/subs.mkv | awk -F, -v t=$1 '$1+0>=t && $2!="N/A"{print $2; exit}'; }
          off 290 > media/subs.mkv.cut-offset; off 150 > media/subs.mkv.cut50-offset
          echo "cut offsets: $(cat media/subs.mkv.cut-offset) (4:50) $(cat media/subs.mkv.cut50-offset) (2:30) of $(stat -c %s media/subs.mkv) bytes"
          bash .github/qa/make_subtitle_video.sh media/subs43.mkv 960x720
          bash .github/qa/make_subtitle_video.sh media/letterbox.mkv 1280x536
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "color=c=0x404040:s=1280x720:r=25:d=120" -c:v libx264 -preset ultrafast -pix_fmt yuv420p -f mpegts media/live.ts
          mkdir -p media/art
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "color=c=0x10C010:s=1920x1080" -frames:v 1 media/art/green.jpg
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "color=c=0x1030D0:s=1920x1080" -frames:v 1 media/art/blue.jpg
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "color=c=0xC01010:s=800x450" -frames:v 1 media/art/small.jpg
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "color=c=0xD01010:s=1920x1080" -frames:v 1 media/art/red.jpg
          head -c 200000 /dev/urandom > media/art/corrupt.jpg
          ls -l media media/art
          nohup python3 .github/qa/media_server.py 8000 media > media.log 2>&1 &
          sleep 1; curl -sI http://127.0.0.1:8000/subs.mkv | head -1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Player and seasonal splash on an Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: android-tv
          arch: x86
          profile: ${{ matrix.profile }}
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: QA_OUT=qa/player-seasonal-api${{ matrix.api }}-${{ matrix.profile }} bash .github/qa/player_seasonal.sh || true
      - name: Result
        run: |
          cat qa/player-seasonal-api${{ matrix.api }}-${{ matrix.profile }}/report.txt || true
          grep -q '^player & seasonal: [0-9]* passed, 0 failed' qa/player-seasonal-api${{ matrix.api }}-${{ matrix.profile }}/report.txt
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          D=qa/player-seasonal-api${{ matrix.api }}-${{ matrix.profile }}
          rm -rf /tmp/results && cp -r "$D" /tmp/results
          # Each try starts from the branch as it is now and replaces only this setup's folder (no merge conflicts).
          for i in 1 2 3 4 5 6 7 8; do
            git fetch -q origin ${GITHUB_REF_NAME} && git checkout -q -B results FETCH_HEAD && rm -rf "$D" && cp -r /tmp/results "$D" && git add -A "$D" \
              && { git diff --cached --quiet || git commit -q -m "Player/seasonal check from TV emulator, API ${{ matrix.api }} ${{ matrix.profile }} (${GITHUB_SHA::7}) [skip ci]"; } \
              && git push origin HEAD:${GITHUB_REF_NAME} && echo pushed && break
            sleep $((i*3 + RANDOM % 7))
          done
