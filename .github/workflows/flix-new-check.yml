name: Flix Town new app compile check
on:
  push:
    branches: [codex/flix-new-check]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - run: find FlixTown-New/panel FlixTown-New/qr-site -name '*.php' -exec php -l {} \;
      - run: gradle assembleDebug --stacktrace
        working-directory: FlixTown-New/android
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: FlixTown-New-unverified-debug
          path: FlixTown-New/android/app/build/outputs/apk/debug/*.apk
