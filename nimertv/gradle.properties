org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Release identity. Raise nimerVersionCode for EVERY published build; the panel
# compares it against the installed versionCode. Can be overridden per build:
#   ./gradlew :app:assembleRelease -PnimerVersionCode=5 -PnimerVersionName=3.0.1
nimerVersionCode=5
nimerVersionName=3.1.1
