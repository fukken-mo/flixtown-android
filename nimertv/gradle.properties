# Release identity. Raise nimerVersionCode for EVERY published build; the panel
# compares it against the installed versionCode. Can be overridden per build:
#   ./gradlew :app:assembleRelease -PnimerVersionCode=4 -PnimerVersionName=3.0.1
nimerVersionCode=3
nimerVersionName=3.0.0
